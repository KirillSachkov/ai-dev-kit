# Hunk — интерактивный review-first diff viewer (github.com/modem-dev/hunk).
# Запуск: hunk diff | hunk diff --staged | hunk show [ref] | hunk stash show
theme = "catppuccin-mocha"        # совпадает с текущей dark-темой Ghostty
mode = "auto"                     # responsive split/stack
vcs = "git"
watch = false                     # live review запускается с --watch явно
exclude_untracked = false         # working-tree review включает новые файлы
line_numbers = true
tab_width = 4
wrap_lines = false
menu_bar = true
sidebar = true                    # дерево файлов открыто при каждом запуске
agent_notes = true                # показывать inline notes от Hunk skill
prompt_save_view_preferences = false
transparent_background = false

[keybindings]
# Работает при любой раскладке; стандартный `?` также остаётся доступен.
"hunk.app.toggleHelp" = ["?", "f1"]
